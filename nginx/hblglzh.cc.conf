# 淮北理工学院卓越工程创新协会主站
# 生产环境静态文件目录：
#   /srv/hblglzh/www/official
#   /srv/hblglzh/www/home
# 协会公开媒体：
#   /srv/hblglzh/data/official/media

server {
    listen 80;
    listen [::]:80;
    server_name hblglzh.cc www.hblglzh.cc;

    root /srv/hblglzh/www/official;
    index index.html;

    # /home 统一补尾斜杠
    location = /home {
        return 301 /home/;
    }

    # 独立导航页静态构建
    location ^~ /home/ {
        alias /srv/hblglzh/www/home/;
        try_files $uri $uri/ /home/index.html;
    }

    # 仅公开媒体目录，不公开 Markdown/数据库等内容
    location ^~ /content/media/ {
        alias /srv/hblglzh/data/official/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Astro 等静态生成页面
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
